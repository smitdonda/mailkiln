name: Release

on:
  push:
    tags:
      - 'v*'

# `id-token: write` is what makes npm provenance possible: npm verifies the
# package was built by this workflow from this commit.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:types
      - run: npx publint
      # Through the npm script, not a bare npx call: the script passes
      # --ignore-rules no-resolution, and without it the CSS export (which has
      # no types by definition) and the node10 subpath fail the run.
      - run: npm run verify:attw

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
